<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkwaSlice (refonte)</title>
    <script src="assets/vendor/tailwindcss.js"></script>
    <script src="assets/vendor/lottie.min.js"></script>
    <script src="lib/prismic-slice.js"></script>
    <script>
        // Tokens de la charte graphique Ekwateur (Design System)
        window.EKW_TW = {
            theme: {
                extend: {
                    colors: {
                        primary: '#17E7D0', 'primary-dark': '#12B5A3', 'primary-deep': '#074E47',
                        cta: '#74F1E3', /* CTA / accent interactif (turquoise clair) */
                        secondary: '#FFC969', 'secondary-dark': '#E6A22A',
                        gold: '#FEDC5D', orange: '#FF931E', cream: '#FFF4DE',
                        night: '#101c1e', /* le plus sombre : fond hors-carte / widget */
                        line: '#1D393D', /* bordure principale des cartes/widgets (1px) */
                        ink: '#132527', 'ink-deep': '#0F1A1C', 'ink-mid': '#1D383C', 'ink-light': '#2C5359',
                        cloud: '#F8FBFB', mist: '#EEF5F6', soft: '#C0DDE2', muted: '#A0B8BC',
                        elec: '#009A59', gas: '#2F80DE', elecmob: '#9A55E1',
                        success: '#7BE87F', warning: '#FBAA6E', error: '#FFA3A3', info: '#82DCEF'
                    },
                    fontFamily: {
                        display: ['Carnero', 'Georgia', 'serif'],
                        body: ['"Gothic A1"', 'system-ui', 'sans-serif']
                    },
                    borderRadius: { btn: '32px', card: '16px', 'card-sm': '8px', tag: '300px' }
                }
            }
        };
        tailwind.config = window.EKW_TW;
    </script>
    <link rel="stylesheet" href="assets/vendor/fontawesome.css">
    <link rel="icon" href="assets/logo.png">
    <style>
        /* =====================================================================
           THÈME DU CHÂSSIS DE L'APP (pas le canvas) — ÉDITE ICI pour restyler.
           Un seul endroit : change les valeurs des variables ci-dessous.
           - Dark = valeurs par défaut sur :root
           - Light (white mode) = valeurs sous html[data-app-theme="light"]
           Le bouton lune/soleil du header bascule entre les deux.
           Les règles plus bas remappent les classes Tailwind slate-* du châssis
           vers ces variables (le contenu du #canvas n'est JAMAIS affecté).
           ===================================================================== */
        :root {
            --app-bg-deep: #101c1e;
            /* fond de l'espace de travail (centre) */
            --app-panel: #0f172a;
            /* panneaux profonds / bulles / inputs */
            --app-surface: #1e293b;
            /* header, barres latérales, modale */
            --app-elevated: #334155;
            /* boutons, steppers, tuiles */
            --app-hover: #475569;
            /* survol */
            --app-border: #334155;
            /* bordures */
            --app-text: #f1f5f9;
            /* texte principal / titres */
            --app-text-2: #cbd5e1;
            /* texte secondaire */
            --app-text-dim: #94a3b8;
            /* texte discret */
            --app-text-faint: #64748b;
            /* texte très discret */
        }

        html[data-app-theme="light"] {
            --app-bg-deep: #e2e8f0;
            --app-panel: #f1f5f9;
            --app-surface: #ffffff;
            --app-elevated: #eef2f6;
            --app-hover: #dbe3ec;
            --app-border: #cbd5e1;
            --app-text: #0f172a;
            --app-text-2: #1e293b;
            --app-text-dim: #475569;
            --app-text-faint: #64748b;
        }

        /* Remap des utilitaires slate-* du châssis (hors #canvas) */
        .bg-slate-950:not(#canvas *) {
            background-color: var(--app-bg-deep) !important;
        }

        .bg-slate-900:not(#canvas *) {
            background-color: var(--app-panel) !important;
        }

        .bg-slate-800:not(#canvas *) {
            background-color: var(--app-surface) !important;
        }

        .bg-slate-700:not(#canvas *),
        .bg-slate-700\/50:not(#canvas *),
        .bg-slate-700\/40:not(#canvas *) {
            background-color: var(--app-elevated) !important;
        }

        .bg-slate-600:not(#canvas *) {
            background-color: var(--app-hover) !important;
        }

        .hover\:bg-slate-700:hover:not(#canvas *),
        .hover\:bg-slate-600:hover:not(#canvas *),
        .hover\:bg-slate-800:hover:not(#canvas *) {
            background-color: var(--app-hover) !important;
        }

        .border-slate-700:not(#canvas *),
        .border-slate-600:not(#canvas *),
        .border-slate-600\/50:not(#canvas *),
        .border-slate-600\/40:not(#canvas *) {
            border-color: var(--app-border) !important;
        }

        .text-white:not(button):not(a):not(#canvas *),
        .text-slate-100:not(#canvas *),
        .text-slate-200:not(#canvas *) {
            color: var(--app-text) !important;
        }

        .text-slate-300:not(#canvas *) {
            color: var(--app-text-2) !important;
        }

        .text-slate-400:not(#canvas *) {
            color: var(--app-text-dim) !important;
        }

        .text-slate-500:not(#canvas *),
        .text-slate-600:not(#canvas *) {
            color: var(--app-text-faint) !important;
        }

        /* Polices Ekwateur — chargées en local (hors-ligne) */
        @font-face {
            font-family: 'Carnero';
            src: url('assets/fonts/carnero-var.ttf') format('truetype');
            font-weight: 300 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Carnero';
            src: url('assets/fonts/carnero-var-italic.ttf') format('truetype');
            font-weight: 300 900;
            font-style: italic;
            font-display: swap;
        }

        @font-face {
            font-family: 'Gothic A1';
            src: url('assets/fonts/gothic-a1-400.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Gothic A1';
            src: url('assets/fonts/gothic-a1-600.otf') format('opentype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Gothic A1';
            src: url('assets/fonts/gothic-a1-700.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        /* Carnero partout dans l'app (chrome). */
        body {
            font-family: 'Carnero', Georgia, serif;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        h1,
        h2,
        h3,
        .font-display {
            font-family: 'Carnero', Georgia, serif;
        }

        /* Élément sélectionné : le visuel est porté par le cadre marching-ants (#ekw-marquee),
           voir plus bas. Ici on garde juste le curseur. */
        .ekw-selected {
            cursor: pointer;
        }

        /* Aperçu au survol : cadre pointillé FIN (distinct du marquee marching-ants de la sélection)
           + étiquette lisible de ce que le clic va sélectionner. Overlays fixes, pointer-events:none. */
        #ekw-hover {
            position: fixed;
            pointer-events: none;
            z-index: 68;
            display: none;
            border: 1px dashed #74F1E3;
            border-radius: 3px;
            background: rgba(116, 241, 227, 0.06);
        }

        #ekw-hover-label {
            position: fixed;
            pointer-events: none;
            z-index: 69;
            display: none;
            font: 600 10px/1.2 system-ui, sans-serif;
            color: #101c1e;
            background: #74F1E3;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
        }

        /* Cadre de sélection "marching ants" — pointillé alterné NOIR/BLANC (aucun vide)
           → lisible en dark comme en light. Overlay fixe qui suit l'élément (marche aussi sur <img>). */
        #ekw-marquee {
            position: fixed;
            pointer-events: none;
            z-index: 70;
            display: none;
            border-radius: 3px;
            background-image:
                linear-gradient(90deg, #000 50%, #fff 50%),
                linear-gradient(90deg, #000 50%, #fff 50%),
                linear-gradient(0deg, #000 50%, #fff 50%),
                linear-gradient(0deg, #000 50%, #fff 50%);
            background-size: 12px 2px, 12px 2px, 2px 12px, 2px 12px;
            background-repeat: repeat-x, repeat-x, repeat-y, repeat-y;
            background-position: 0 0, 0 100%, 0 0, 100% 0;
            animation: ekw-ants 0.7s linear infinite;
        }

        @keyframes ekw-ants {
            to {
                background-position: 12px 0, 12px 100%, 0 12px, 100% 12px;
            }
        }

        #canvas [data-comp] {
            cursor: pointer;
        }

        /* Élément en cours d'édition de texte */
        .ekw-editing,
        .ekw-editing * {
            cursor: text !important;
        }

        .ekw-editing {
            outline: 2px dashed #17E7D0 !important;
            outline-offset: 3px;
            background: rgba(23, 231, 208, 0.07);
            border-radius: 4px;
        }

        .preview-canvas::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .preview-canvas::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">
    <div id="canvas"></div>
    <script type="module" src="src/bootstrap.js"></script>
</body>

</html>
