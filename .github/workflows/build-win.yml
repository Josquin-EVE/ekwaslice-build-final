name: Build Windows (.exe)

# Se déclenche quand tu pushes un tag de version (ex: v1.0.11),
# ou manuellement depuis l'onglet Actions (bouton "Run workflow").
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour attacher l'installeur à la Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Build seul (pas de publish) — electron-builder refuse d'uploader sur une
      # release publiée il y a +2h ; on uploade nous-mêmes juste après.
      - name: Build .exe (no publish)
        run: npm run build:win

      # Upload direct sur la Release existante via gh (contourne le garde-fou 2h).
      - name: Upload installer to GitHub Release
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release upload "v$VER" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
